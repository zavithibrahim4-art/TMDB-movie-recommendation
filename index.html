<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover movies, explore trending films, and get personalized movie recommendations."
    />
    <link rel="stylesheet" href="style.css" />
    <title>Movie Recommendation</title>
  </head>
  <body>
    
    <div class="top-bar">
    <input type="text" placeholder="Enter a movie name">

    <button class="toggle" onclick="toggleSwitch()">
        Dark Mode
    </button>
</div>
    <p class="results-info"></p>
    <div class="js-adder"></div>
    <p class="error">Please enter a valid name</p>
    <p class="error-2 js-error-2"></p>

    <div class="trailer-modal">
      <div class="trailer-container">
        <button class="close-trailer">✕</button>

        <div class="trailer"></div>
      </div>
    </div>
    <button class="button" onclick="location.reload()">Return to Home</button>
    <script src="script.js"></script>
  </body>
</html>
